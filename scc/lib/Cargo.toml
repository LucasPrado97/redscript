[package]
name = "scc-lib"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
redscript = { path = "../../core" }
redscript-compiler = { path = "../../compiler" }
log.workspace = true
anyhow.workspace = true
hashbrown = { workspace = true, features = ["serde"] }
byteorder.workspace = true
flexi_logger.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
vmap = { version = "0.6", default-features = false, optional = true }
normpath = "1"
fd-lock = "4"
msgbox = { version = "0.7", optional = true }

[dev-dependencies]
pretty_assertions = "1"
assert_fs = "1"
assert_cmd = "2"
predicates = "3"

[features]
popup = ["msgbox"]
mmap = ["vmap"]
# Embedded build (iOS, or macOS with the iOS code path): never shows a native dialog, logs to the file only,
# and turns a compiler panic into an error result instead of unwinding into (and aborting) the host app.
ios = []

[lints]
workspace = true
